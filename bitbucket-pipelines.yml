# ============================================================================
# Bitbucket Pipelines Configuration
# CI/CD pipeline for Databricks AWS Infrastructure
# ============================================================================

image: hashicorp/terraform:1.13.1

definitions:
  caches:
    terraform: stacks/*/.terraform

  steps:
    # ========================================================================
    # Lint Step: Format check and static analysis
    # ========================================================================
    terraform-lint: &terraform-lint
      name: terraform fmt + tflint
      script:
        - terraform -version
        - apk add --no-cache curl unzip
        - curl -sSLo /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.50.0/tflint_linux_amd64.zip
        - unzip -o /tmp/tflint.zip -d /usr/local/bin
        - terraform fmt -check -recursive
        - tflint --recursive

    # ========================================================================
    # Validate Step: Initialize and validate all stacks
    # ========================================================================
    terraform-validate: &terraform-validate
      name: validate stacks (all)
      caches:
        - terraform
      script:
        - |
          set -euo pipefail
          STACKS="stacks/00_bootstrap stacks/01_infra stacks/02_account_principals stacks/03_uc_metastore stacks/04_databricks_workspaces"
          for stack in $STACKS; do
            echo "==> VALIDATE: ${stack}"
            ( cd "${stack}" && terraform init -backend=false && terraform validate -no-color )
          done

    # ========================================================================
    # Plan Step (Non-blocking): Show plan output without failing on errors
    # Useful for PR reviews to see potential changes
    # ========================================================================
    terraform-plan-pr: &terraform-plan-pr
      name: terraform plan (informational)
      oidc: true
      caches:
        - terraform
      script:
        - |
          # ================================================================
          # AWS Authentication via OIDC
          # ================================================================
          export AWS_REGION=$AWS_REGION
          export AWS_ROLE_ARN=$AWS_ROLE_ARN
          export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
          export AWS_ROLE_SESSION_NAME=bitbucket-pipeline-session
          echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token

          STACKS="stacks/00_bootstrap stacks/01_infra stacks/02_account_principals stacks/03_uc_metastore stacks/04_databricks_workspaces"
          FAILED_STACKS=""

          for stack in $STACKS; do
            echo ""
            echo "============================================================"
            echo "==> PLAN: ${stack}"
            echo "============================================================"
            if ( cd "${stack}" && terraform init -input=false && terraform plan -no-color 2>&1 | tee plan.log ); then
              echo "Plan succeeded for ${stack}"
            else
              echo "Plan failed for ${stack} (continuing...)"
              FAILED_STACKS="${FAILED_STACKS} ${stack}"
            fi
          done

          echo ""
          echo "============================================================"
          echo "==> PLAN SUMMARY"
          echo "============================================================"
          if [ -n "$FAILED_STACKS" ]; then
            echo "Some stacks failed to plan:${FAILED_STACKS}"
            echo "This is informational only - the step will not fail."
          else
            echo "All stacks planned successfully"
          fi
      artifacts:
        - stacks/*/plan.log

pipelines:
  # ==========================================================================
  # Pull Request Validation
  # Runs on all PRs to ensure code quality
  # ==========================================================================
  pull-requests:
    '**':
      - step: *terraform-lint
      - step: *terraform-validate
      - step: *terraform-plan-pr

  # ==========================================================================
  # Branch Pipelines
  # ==========================================================================
  branches:
    main:
      - step: *terraform-lint
      - step: *terraform-validate
      - step:
          name: terraform plan + apply (sequential)
          oidc: true
          caches:
            - terraform
          trigger: manual
          script:
            - |
              # ================================================================
              # AWS & Databricks Authentication
              # ================================================================
              # Required repository variables:
              # - AWS_REGION
              # - AWS_ROLE_ARN
              # - DATABRICKS_CLIENT_ID (for Databricks account operations)
              # - DATABRICKS_CLIENT_SECRET (for Databricks account operations)
              # ================================================================
              export AWS_REGION=$AWS_REGION
              export AWS_ROLE_ARN=$AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
              export AWS_ROLE_SESSION_NAME=bitbucket-pipeline-session
              echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token

              set -euo pipefail
              STACKS="stacks/00_bootstrap stacks/01_infra stacks/02_account_principals stacks/03_uc_metastore stacks/04_databricks_workspaces"
              for stack in $STACKS; do
                echo "==> PLAN: ${stack}"
                ( cd "${stack}" && terraform init -input=false && terraform plan -no-color -out=tfplan.out | tee plan.log )
                echo "==> APPLY: ${stack}"
                ( cd "${stack}" && terraform apply -auto-approve -no-color tfplan.out )
              done
          artifacts:
            - stacks/*/tfplan.out
            - stacks/*/plan.log

  # ==========================================================================
  # Custom Pipelines
  # Manual triggers for specific deployment scenarios
  # ==========================================================================
  custom:
    # ------------------------------------------------------------------------
    # Infrastructure Only
    # Bootstrap + VPC + Network Infrastructure
    # ------------------------------------------------------------------------
    apply-infra:
      - step: *terraform-lint
      - step:
          name: terraform plan + apply (infra only)
          oidc: true
          caches:
            - terraform
          script:
            - |
              export AWS_REGION=$AWS_REGION
              export AWS_ROLE_ARN=$AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
              export AWS_ROLE_SESSION_NAME=bitbucket-pipeline-session
              echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token

              set -euo pipefail
              STACKS="stacks/00_bootstrap stacks/01_infra"
              for stack in $STACKS; do
                echo "==> PLAN: ${stack}"
                ( cd "${stack}" && terraform init -input=false && terraform plan -no-color -out=tfplan.out | tee plan.log )
                echo "==> APPLY: ${stack}"
                ( cd "${stack}" && terraform apply -auto-approve -no-color tfplan.out )
              done
          artifacts:
            - stacks/*/tfplan.out
            - stacks/*/plan.log

    # ------------------------------------------------------------------------
    # Databricks Only
    # Account principals + Metastore + Workspaces
    # ------------------------------------------------------------------------
    apply-databricks:
      - step: *terraform-lint
      - step:
          name: terraform plan + apply (databricks only)
          oidc: true
          caches:
            - terraform
          script:
            - |
              export AWS_REGION=$AWS_REGION
              export AWS_ROLE_ARN=$AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
              export AWS_ROLE_SESSION_NAME=bitbucket-pipeline-session
              echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token

              set -euo pipefail
              STACKS="stacks/02_account_principals stacks/03_uc_metastore stacks/04_databricks_workspaces"
              for stack in $STACKS; do
                echo "==> PLAN: ${stack}"
                ( cd "${stack}" && terraform init -input=false && terraform plan -no-color -out=tfplan.out | tee plan.log )
                echo "==> APPLY: ${stack}"
                ( cd "${stack}" && terraform apply -auto-approve -no-color tfplan.out )
              done
          artifacts:
            - stacks/*/tfplan.out
            - stacks/*/plan.log

    # ------------------------------------------------------------------------
    # Workspaces Only
    # Databricks workspaces and their configuration
    # Useful for updating workspace config without recreating infrastructure
    # ------------------------------------------------------------------------
    apply-workspaces:
      - step: *terraform-lint
      - step:
          name: terraform plan + apply (workspaces only)
          oidc: true
          caches:
            - terraform
          script:
            - |
              export AWS_REGION=$AWS_REGION
              export AWS_ROLE_ARN=$AWS_ROLE_ARN
              export AWS_WEB_IDENTITY_TOKEN_FILE=$(pwd)/web-identity-token
              export AWS_ROLE_SESSION_NAME=bitbucket-pipeline-session
              echo $BITBUCKET_STEP_OIDC_TOKEN > $(pwd)/web-identity-token

              set -euo pipefail
              STACKS="stacks/04_databricks_workspaces"
              for stack in $STACKS; do
                echo "==> PLAN: ${stack}"
                ( cd "${stack}" && terraform init -input=false && terraform plan -no-color -out=tfplan.out | tee plan.log )
                echo "==> APPLY: ${stack}"
                ( cd "${stack}" && terraform apply -auto-approve -no-color tfplan.out )
              done
          artifacts:
            - stacks/*/tfplan.out
            - stacks/*/plan.log
